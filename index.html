<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Math Work"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#1D5BD8">
<title>Strip Diagram Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;800&family=Lexend:wght@400;600;800&family=Atkinson+Hyperlegible+Mono:wght@500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
/* Layout: one problem per screen, large dwell targets, fixed Back/Next bar; teacher setup is a plain form page. */
:root{
  --bg:#E8EDF2; --surface:#FFFFFF; --ink:#14202E; --muted:#4D5B6B; --line:#B7C2CE;
  --accent:#1D5BD8; --accent-ink:#FFFFFF; --focus:#E89B00;
  --seg1:#CFE0FB; --seg2:#FBE2B0; --seg3:#CBEAD4; --seg4:#F5CFD9; --unknown:#FFFFFF;
  --ok:#17783F; --warn:#A84B06; --scrim:rgba(14,22,32,.55);
  --f-ui:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sz:1; --tap:calc(clamp(52px, 8.2vh, 118px) * var(--sz)); --fs:calc(clamp(15px, 1vw + .95vh, 27px) * (0.9 + 0.1 * var(--sz))); --gap:clamp(10px, 1.6vh, 22px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1620; --surface:#18222F; --ink:#E8EEF5; --muted:#A5B2C1; --line:#3A4858;
  --accent:#73A0FF; --accent-ink:#0B1220; --focus:#FFC233;
  --seg1:#22395F; --seg2:#4A3916; --seg3:#1E452F; --seg4:#4A2433; --unknown:#18222F;
  --ok:#5CD08C; --warn:#F2A262; --scrim:rgba(0,0,0,.65); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1620; --surface:#18222F; --ink:#E8EEF5; --muted:#A5B2C1; --line:#3A4858;
  --accent:#73A0FF; --accent-ink:#0B1220; --focus:#FFC233;
  --seg1:#22395F; --seg2:#4A3916; --seg3:#1E452F; --seg4:#4A2433; --unknown:#18222F;
  --ok:#5CD08C; --warn:#F2A262; --scrim:rgba(0,0,0,.65); color-scheme:dark }
:root.size-standard{--sz:.82}
:root.size-xl{--sz:1.22}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:calc(var(--fs)*var(--ts,1));line-height:1.4;margin:0}
#app{height:100%;min-height:0;display:flex;flex-direction:column;padding-inline:16px;padding-block:10px 0;max-width:1600px;margin:0 auto}
html:not(.tview) body{overflow:hidden}
html.tview #app{height:auto;min-height:100%}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.25em;font-weight:800}
h2{font-size:1.05em;font-weight:800}
p{margin:0}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

button{font:inherit;color:inherit}
.btn{min-height:var(--tap);padding:0 1.1em;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.35;cursor:default}
button:focus-visible,.btn:hover,.slot:hover,.cell:hover,.chip:hover,.key:hover,.pcard:hover,.mcard:hover{outline:5px solid var(--focus);outline-offset:2px}
button:active{transform:translateY(1px)}
@media (prefers-reduced-motion: reduce){button:active{transform:none}}

/* header */
.top{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap;padding-block:6px 14px}
.top h1{flex:1;min-width:min(100%,9em)}
.eyebrow{font-size:.62em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* home */
.home{display:flex;flex-direction:column;gap:var(--gap);flex:1}
.lead{color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:var(--gap)}
.pcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-align:left;padding:20px;min-height:calc(var(--tap)*2);background:var(--surface);border:3px solid var(--line);border-radius:18px;cursor:pointer}
.pnum{font-weight:800;font-size:1.1em}
.ptext{color:var(--muted);font-size:.8em;line-height:1.35}
.status{margin-top:auto;font-size:.7em;font-weight:700;padding:4px 12px;border-radius:999px;border:2px solid var(--line)}
.status.s-done{border-color:var(--ok);color:var(--ok)}
.status.s-going{border-color:var(--accent);color:var(--accent)}
.empty-home{background:var(--surface);border:3px dashed var(--line);border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:12px;max-width:62ch}
.foot-home{padding-block:24px;display:flex;justify-content:flex-end}

/* problem screen */
.prob{display:flex;gap:var(--gap);align-items:flex-start;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:16px 20px}
.prob p{flex:1;min-width:0;font-size:1.05em;line-height:1.45;max-width:75ch}
.progress{list-style:none;display:flex;gap:6px;padding:0;margin:14px 0 6px;flex-wrap:wrap}
.progress li{flex:1;min-width:90px;font-size:.62em;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-top:6px solid var(--line);padding-top:6px}
.progress li.done{border-color:var(--accent);color:var(--ink)}
.progress li.now{border-color:var(--focus);color:var(--ink)}
.stage{flex:1;display:flex;flex-direction:column;gap:var(--gap);padding-block:12px 24px}
.ask{font-weight:700;font-size:1.05em}
.navbar{flex:none;display:flex;gap:var(--gap);justify-content:space-between;background:var(--bg);padding-block:12px calc(14px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--line)}
.navbar .btn{min-width:min(42%,320px);font-size:1.1em}

/* model picker */
.models{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:var(--gap)}
.mcard{display:flex;flex-direction:column;gap:14px;padding:20px;background:var(--surface);border:3px solid var(--line);border-radius:18px;cursor:pointer;text-align:left;min-height:calc(var(--tap)*2.4)}
.mcard.on{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent) inset}
.mcard .mt{font-weight:800}
.mcard .ms{font-size:.75em;color:var(--muted)}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .r{display:flex;height:30px;border:3px solid var(--ink);border-radius:4px;overflow:hidden}
.mini .r span{flex:1;border-right:3px solid var(--ink)}
.mini .r span:last-child{border-right:0}
.mini .br{height:12px;border:3px solid var(--ink);border-top:0;border-radius:0 0 8px 8px}
.mini .cmpr{display:flex;flex-direction:column;gap:6px}
.mini .short{display:flex;height:30px}
.mini .short .b{flex:0 0 62%;border:3px solid var(--ink);border-radius:4px;background:var(--seg2)}
.mini .short .d{flex:1;border:3px dashed var(--ink);border-left:0;border-radius:0 4px 4px 0}

/* diagram */
.dg{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:22px}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:calc(var(--tap)*1.15);padding:8px 10px;cursor:pointer;color:var(--ink);text-align:center;min-width:0}
.slot .nm{font-size:.7em;font-weight:700;color:var(--muted);min-height:1.2em}
.slot .val{font-family:var(--f-num);font-weight:700;font-size:1.05em;overflow-wrap:anywhere}
.slot .val.empty{font-family:var(--f-ui);font-weight:600;font-size:.72em;color:var(--muted)}
.bar{display:flex;border:4px solid var(--ink);border-radius:6px;overflow:hidden}
.bar .slot{flex:1;border:0;border-right:4px solid var(--ink);border-radius:0}
.bar .slot:last-child{border-right:0}
.seg1{background:var(--seg1)} .seg2{background:var(--seg2)} .seg3{background:var(--seg3)} .seg4{background:var(--seg4)}
.brace{height:24px;border:4px solid var(--ink);border-top:0;border-radius:0 0 14px 14px;margin:6px 4px 10px}
.whole-wrap{display:flex;justify-content:center}
.slot.whole{border:4px solid var(--ink);border-radius:14px;background:var(--unknown);min-width:min(100%,260px)}
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(130px,24%);align-items:center;gap:0 10px}
.cmp-rows{display:flex;flex-direction:column;gap:14px}
.crow{display:flex}
.crow .slot.seg{border:4px solid var(--ink);border-radius:6px}
.crow .slot.full{flex:1}
.crow .slot.short{flex:0 0 62%}
.crow .slot.diff{flex:1;border:4px dashed var(--ink);border-left:0;border-radius:0 6px 6px 0;background:var(--unknown)}
.vbrace{align-self:stretch;border:4px solid var(--ink);border-left:0;border-radius:0 14px 14px 0}
.cmp .slot.whole{min-width:0}
.rowlab{font-size:.7em;color:var(--muted);font-weight:700;margin-bottom:4px}
.hint{color:var(--muted);font-size:.85em}

/* steps */
.eqs{display:flex;flex-direction:column;gap:var(--gap)}
.eq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:14px}
.eq .lbl{font-size:.65em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:100%}
.cell{min-height:var(--tap);min-width:calc(var(--tap)*1.9);padding:0 16px;border:3px solid var(--ink);border-radius:12px;background:var(--bg);font-family:var(--f-num);font-weight:700;font-size:1.05em;cursor:pointer;color:var(--ink)}
.cell.empty{font-family:var(--f-ui);font-weight:600;font-size:.75em;color:var(--muted);border-style:dashed}
.cell.op{min-width:var(--tap);font-size:1.5em;background:var(--surface)}
.eqsign{font-size:1.5em;font-weight:800;padding:0 4px}
.cell.rm{min-width:0;font-family:var(--f-ui);font-size:.7em;border-color:var(--line);color:var(--muted);margin-left:auto}
.mark{font-weight:800;font-size:.8em;padding:6px 12px;border-radius:999px;border:2px solid}
.mark.ok{color:var(--ok);border-color:var(--ok)} .mark.no{color:var(--warn);border-color:var(--warn)}
.add{align-self:flex-start}

/* answer */
.frame{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:24px;font-size:1.15em;line-height:2.4}
.frame .cell{vertical-align:middle;margin:0 6px}

/* record */
.record{display:flex;flex-direction:column;gap:var(--gap);background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:22px}
.record h3{font-size:.7em;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.record .dg{border:0;padding:0}
.rec-eq{font-family:var(--f-num);font-weight:700}
.rec-ans{font-size:1.1em;font-weight:700}
.rowbtns{display:flex;gap:var(--gap);flex-wrap:wrap;align-items:center}
.copybox{width:100%;min-height:8em;font:inherit;font-size:.7em;font-family:var(--f-num)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:10;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{width:min(1180px,100%);max-height:100%;overflow:hidden;background:var(--surface);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;border:3px solid var(--line)}
.sheet-title{font-weight:800}
.display{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;min-height:var(--tap);border:3px solid var(--ink);border-radius:14px;padding:10px 18px;background:var(--bg)}
.display .dname{font-weight:700;color:var(--muted)}
.display .dval{font-family:var(--f-num);font-weight:700;font-size:1.4em}
.sheet-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:18px}
.lab{font-size:.65em;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px}
.chip{min-height:var(--tap);padding:0 18px;border:3px solid var(--line);border-radius:14px;background:var(--bg);font-weight:700;cursor:pointer}
.chip.n{font-family:var(--f-num)}
.chip.on{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.chip.q{border-style:dashed;border-color:var(--ink)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:var(--tap);border:3px solid var(--line);border-radius:14px;background:var(--bg);font-family:var(--f-num);font-size:1.3em;font-weight:700;cursor:pointer}
.key.fn{font-family:var(--f-ui);font-size:.8em}
.units{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.units .chip{flex:1;font-family:var(--f-num)}
.sheet-foot{display:flex;justify-content:space-between;gap:var(--gap)}
.sheet-foot .btn{min-width:min(42%,300px)}
.ops{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.ops .key{font-size:2em;min-height:calc(var(--tap)*1.3)}

/* teacher */
.teacher{display:flex;flex-direction:column;gap:18px;padding-block:6px 40px;font-size:17px}
.teacher .btn{min-height:48px;font-size:16px;border-width:2px;border-radius:10px}
.tcard{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.tcard p{color:var(--muted);max-width:70ch}
.tlist{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:10px}
.tlist li{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.tlist li span{flex:1;min-width:min(100%,240px)}
.teacher label{font-weight:700;display:flex;flex-direction:column;gap:6px}
.teacher input[type=text],.teacher textarea,.teacher select{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.teacher textarea{min-height:7em}
.teacher .check{flex-direction:row;align-items:center;gap:10px;font-weight:600}
.teacher .check input{width:24px;height:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.small{font-size:14px;color:var(--muted)}
.err{color:var(--warn);font-weight:700}
.okmsg{color:var(--ok);font-weight:700}
.sect{border:2px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sect h3{font-size:16px}
.pick{display:flex;gap:12px;align-items:flex-start;font-weight:400!important;flex-direction:row!important}
.pick input{width:22px;height:22px;flex:none;margin-top:3px}
.detect{font-family:var(--f-num);font-size:14px;color:var(--muted)}

@media (max-width:720px){
  .sheet-body{grid-template-columns:1fr}
  .cmp{grid-template-columns:minmax(0,1fr) 18px minmax(96px,32%)}
  .prob{flex-direction:column}
}

/* v2 additions */
.prob{flex-direction:column}
.prob .ptop{display:flex;gap:var(--gap);align-items:flex-start;width:100%}
.prob .ptop p{flex:1}
.pq{font-weight:700}
.info{display:flex;gap:var(--gap);flex-wrap:wrap;width:100%}
.info .tw{min-width:0;max-width:100%;overflow-x:auto}
.info .ttl{font-size:.7em;font-weight:800;color:var(--muted);margin-bottom:4px}
.info .nt{font-size:.75em;color:var(--muted);margin-top:4px}
.gt{border-collapse:collapse;font-size:.85em}
.gt th,.gt td{border:2px solid var(--line);padding:6px 12px;text-align:center}
.gt th{background:var(--bg);font-size:.8em}
.chip-tag{display:inline-block;font-size:.6em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border:2px solid var(--line);border-radius:999px;padding:2px 10px}
.items{display:flex;flex-direction:column;gap:var(--gap)}
.item{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:12px 18px;line-height:2.6;font-size:1.05em}
.item .cell{vertical-align:middle;margin:0 6px}
.choice{display:inline-flex;gap:8px;vertical-align:middle;margin:0 6px}
.choice .cell{min-width:var(--tap);font-size:1.4em;margin:0}
.cell.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);border-style:solid}
.tablewrap{overflow-x:auto;max-width:100%}
.wt{border-collapse:separate;border-spacing:8px;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:8px}
.wt th{font-size:.7em;font-weight:800;color:var(--muted);padding:6px 10px;text-align:center}
.wt td{text-align:center;font-family:var(--f-num);font-weight:700;padding:0;min-width:calc(var(--tap)*1.6)}
.wt td.given{background:var(--bg);border-radius:12px;padding:0 14px;height:var(--tap)}
.wt td .cell{width:100%}
.rule{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:12px 18px;font-weight:800}
.rule .cell{flex:1;min-width:min(100%,280px);text-align:left;font-family:var(--f-ui)}
.ansbox{width:100%;min-height:calc(var(--tap)*1.6);text-align:left;padding:14px 18px;font-family:var(--f-ui);font-weight:600;line-height:1.4}
.order{display:flex;flex-direction:column;gap:var(--gap)}
.order .pool{display:flex;flex-wrap:wrap;gap:var(--gap)}
.order .pool .chip{font-family:var(--f-num);font-size:1.05em}
.order .seq{display:flex;flex-wrap:wrap;gap:12px;align-items:center;min-height:var(--tap);background:var(--surface);border:3px dashed var(--line);border-radius:18px;padding:12px 16px}
.order .seq .s{font-family:var(--f-num);font-weight:700;border:3px solid var(--ink);border-radius:12px;padding:10px 14px;background:var(--bg)}
.order .seq .lt{font-weight:800;color:var(--muted)}
.worksec{display:flex;flex-direction:column;gap:var(--gap);border-top:3px dashed var(--line);padding-top:var(--gap)}
.sheet-head{display:flex;align-items:center;gap:var(--gap);flex-wrap:wrap}
.sheet-head .sheet-title{flex:1;min-width:min(100%,200px)}
.sheet-head .btn{min-width:min(30%,200px)}
.stt{width:100%;min-height:calc(var(--tap)*1.1);font:inherit;font-size:.95em;padding:10px 14px;border:3px solid var(--accent);border-radius:14px;background:var(--bg);color:var(--ink)}
.ops4{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.ops4 .key{font-size:1.4em}
.pic{max-width:100%;border:3px solid var(--line);border-radius:12px;background:#fff}
.howto{background:var(--surface);border:3px solid var(--line);border-radius:18px;padding:16px 20px;font-size:.8em;line-height:1.5}
.howto ol{margin:6px 0 0;padding-left:1.3em}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px}
.pickgrid .btn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.plist label{flex-direction:row!important;align-items:flex-start;gap:10px;font-weight:400!important}
.plist input{width:22px;height:22px;flex:none;margin-top:3px}
.plist .pn{font-weight:800;min-width:2.2em}
.attrib{font-size:13px;color:var(--muted)}
details.tcard summary{font-weight:800;cursor:pointer}
.sheet-body.one{grid-template-columns:1fr}
.sheet-body.one .pad,.sheet-body.one .units{max-width:640px;margin-inline:auto}

.figure{max-width:min(100%,560px);background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px}
.nlrow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;line-height:1.3;margin-top:8px}
.nlc{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.nll{font-size:.6em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.algtabs{flex-wrap:nowrap;overflow-x:auto;padding:6px 4px}
.algtabs .btn{min-width:calc(var(--tap)*.8);padding:0 .5em;flex:none}
.algwrap{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
.alg{border-collapse:collapse;background:var(--surface);border:3px solid var(--line);border-radius:18px}
.alg td{padding:4px;text-align:center}
.alg td.g3{padding-right:16px}
.alg .aop{font-size:1.6em;font-weight:800;min-width:1.4em;color:var(--ink)}
.alg .aop.small{font-size:.55em;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* calculator */
function calcApply(a,b,op){return op==="+"?a+b:op==="−"?a-b:op==="×"?a*b:op==="÷"?(b?a/b:NaN):b}
function calcShow(n){if(!isFinite(n))return"Error";const r=Math.round(n*10000)/10000;const neg=r<0;const [i,d]=String(Math.abs(r)).split(".");return(neg?"-":"")+group(i)+(d?"."+d:"")}
function calcPress(k){const c=S.calc;c.note="";
  if(/^\d$/.test(k)||k==="⌫")S.calcLast=null;
  if(/^\d$/.test(k)){c.disp=c.fresh||c.disp==="0"?k:(c.disp.length<12?c.disp+k:c.disp);c.fresh=false;return}
  if(k==="C"){S.calc={disp:"0",acc:null,op:null,fresh:true,note:""};S.calcLast=null;return}
  if(k==="⌫"){if(!c.fresh)c.disp=c.disp.length>1?c.disp.slice(0,-1):"0";return}
  const cur=parseFloat(c.disp.replace(/,/g,""));
  if(k==="="){if(c.op&&!c.fresh){const a=c.acc,op=c.op;const res=calcApply(a,cur,op);
      if(op==="÷"&&Number.isInteger(a)&&Number.isInteger(cur)&&cur&&a%cur)c.note=`${group(String(Math.trunc(a/cur)))} R ${a%cur}`;
      c.disp=String(Math.round(res*10000)/10000);c.acc=null;c.op=null;c.fresh=true;
      if(isFinite(res)){const rec={a,op,b:cur,res,note:c.note};S.calcLast=rec;S.calcHist=[rec].concat((S.calcHist||[]).filter(h=>!(h.a===a&&h.op===op&&h.b===cur))).slice(0,6)}}return}
  if(c.op&&!c.fresh)c.acc=calcApply(c.acc,cur,c.op);else if(c.op==null||c.acc==null)c.acc=cur;
  c.op=k;c.disp=String(Math.round(c.acc*10000)/10000);c.fresh=true;
}
function renderCalc(){const c=S.calc;
  const keys=["7","8","9","÷","4","5","6","×","1","2","3","−","C","0","⌫","+"];

   <div class="ckeys">${keys.map(k=>`<button class="key ${/\d/.test(k)?"":"fn"}" data-act="calc" data-v="${k}" aria-label="${esc(SYM[k]||(k==="C"?"clear":k==="⌫"?"back up":k))}">${k==="C"?"Clear":k==="⌫"?"Back up":k}</button>`).join("")}<button class="key eqk" data-act="calc" data-v="=" aria-label="equals">=</button></div>
   ${S.calcLast&&stepsVisible()?`<button class="btn primary calcstep" data-act="calcstep">Put ${esc(calcLine(S.calcLast))} in my steps</button>`:""}
   ${(S.calcHist||[]).length?`<div class="chist"><p class="lab">Recent</p>${S.calcHist.map(h=>`<p class="num">${esc(calcLine(h))}</p>`).join("")}<p class="small">These answers also show up as buttons when you fill in a box.</p></div>`:""}
  </div></aside>`;
}

/* switch scanning */
const SCN={lvl:"g",groups:[],gi:-1,ii:-1,timer:null};
const SCAN_CONT=".calchead,.sbn,.optrow,.tilegrid,.sheet-head,.chips,.pad,.ops4,.ops,.units,.ckeys,header.top,.models,.dg,.eq,.item,.wt,.rule,.frame,.pool,.rowbtns,.algtabs,.alg,.apad,.cards,.navbar,.breakbox,.focusnav,.worksec";
const GNAME={sbn:"scroll buttons",optrow:"options",tilegrid:"tools","sheet-head":"close and done",chips:"word buttons",pad:"number keys",ops4:"operation keys",ops:"operations",units:"units",ckeys:"calculator keys",top:"top buttons",models:"diagram choices",dg:"diagram",eq:"math step",item:"item",wt:"table",rule:"rule",frame:"answer sentence",pool:"choices",rowbtns:"buttons",algtabs:"problem letters",alg:"answer boxes",apad:"digit keys",cards:"problems",navbar:"back and next",focusnav:"item buttons",worksec:"work"};

function scanBuild(){const root=document.querySelector(".scrim")||app;
  const btns=[...root.querySelectorAll("button:not([disabled])")].filter(b=>b.offsetParent!==null&&b.dataset.act!=="teacher");
  const map=new Map();btns.forEach(b=>{const c=b.closest(SCAN_CONT)||b.parentElement;if(!map.has(c))map.set(c,[]);map.get(c).push(b)});
  SCN.groups=[...map.entries()].map(([el,items])=>({el,items}));}
function scanClear(){document.querySelectorAll(".scan-g,.scan-i,.scan-back").forEach(e=>e.classList.remove("scan-g","scan-i","scan-back"))}
function groupName(g){for(const k of Object.keys(GNAME))if(g.el.classList.contains(k))return GNAME[k];return"group"}
function scanShow(){scanClear();const g=SCN.groups[SCN.gi];if(!g)return;let el,say;
  if(SCN.lvl==="g"){if(g.items.length===1){el=g.items[0];el.classList.add("scan-i");say=btnLabel(el)}else{el=g.el;el.classList.add("scan-g");say=groupName(g)}}
  else if(SCN.ii>=g.items.length){el=g.el;el.classList.add("scan-back");say="go back"}
  else{el=g.items[SCN.ii];el.classList.add("scan-i");say=btnLabel(el)}
  try{el.scrollIntoView({block:"nearest",inline:"nearest"})}catch(e){}
  if(settings.scanAudio)speak(say);}
function scanNext(){if(!SCN.groups.length)return;
  if(SCN.lvl==="g")SCN.gi=(SCN.gi+1)%SCN.groups.length;else SCN.ii=(SCN.ii+1)%(SCN.groups[SCN.gi].items.length+1);scanShow()}
function scanTimer(){clearInterval(SCN.timer);if(settings.scan==="auto"&&scanOn())SCN.timer=setInterval(scanNext,(+settings.scanSpeed||2)*1000)}
function scanSelect(){const g=SCN.groups[SCN.gi];if(!g){scanNext();return}
  if(SCN.lvl==="g"){if(g.items.length===1){scanClear();g.items[0].click()}else{SCN.lvl="i";SCN.ii=0;scanShow();scanTimer()}}
  else if(SCN.ii>=g.items.length){SCN.lvl="g";scanShow();scanTimer()}
  else{const b=g.items[SCN.ii];scanClear();b.click()}}
function scanReset(){clearInterval(SCN.timer);scanClear();if(!scanOn())return;scanBuild();SCN.lvl="g";SCN.gi=-1;SCN.ii=-1;scanNext();scanTimer()}
document.addEventListener("keydown",e=>{if(!scanOn()||e.target.matches("input,textarea,select"))return;

function render(){

  if(S.ed)h+=renderSheet();
  const oldSheet=document.querySelector(".scrim .sbx");const keepScroll=oldSheet&&S.ed&&S.ed.mode==="tools"?oldSheet.scrollTop:null;
  app.innerHTML=h;
  document.documentElement.classList.toggle("tview",S.view==="teacher");
  if(keepScroll!=null){const ns=document.querySelector(".scrim .sbx");if(ns)ns.scrollTop=keepScroll}
  if(S.view==="teacher")bindTeacher();
  const img=document.getElementById("pic");if(img){try{img.src=picture(prob(S.pid)).toDataURL("image/png")}catch(e){}}
  const all=document.getElementById("picall");if(all){try{all.src=pictureAll().toDataURL("image/png")}catch(e){}}
  document.querySelectorAll(".cell.empty,.acell:empty").forEach(b=>b.setAttribute("aria-label","Empty box. Select to fill in."));
  if(S.view==="problem"&&!S.ed){const sc=curSc();const key=S.pid+"/"+(sc.done?"done":sc.pi);if(key!==S.lastRead){S.lastRead=key;if(settings.autoRead&&!sc.done)readProblem()}}
  addScrollers();
  if(S.scrollSteps){S.scrollSteps=false;const eqs=document.querySelectorAll(".eq");const last=eqs[eqs.length-1];if(last){try{last.scrollIntoView({block:"nearest"})}catch(e){}last.classList.add("justadded")}}
  document.querySelectorAll("img").forEach(im=>{if(!im.complete)im.addEventListener("load",addScrollers,{once:true})});
  scanReset();
}
function addScrollers(){document.querySelectorAll(".sbw").forEach(w=>{const x=w.querySelector(":scope>.sbx");if(!x)return;
  const old=w.querySelector(":scope>.sbn");if(old)old.remove();w.classList.remove("ovf");
  if(x.scrollHeight<=x.clientHeight+4)return;
  w.classList.add("ovf");if(x.scrollHeight<=x.clientHeight+4){w.classList.remove("ovf");return}
  const n=document.createElement("div");n.className="sbn";
  n.innerHTML=`<button class="btn sbu" aria-label="Scroll up"><span class="ar">▲</span>Up</button><button class="btn sbd" aria-label="Scroll down"><span class="ar">▼</span>Down</button>`;
  const up=n.firstChild,dn=n.lastChild;
  const upd=()=>{up.disabled=x.scrollTop<=2;dn.disabled=x.scrollTop+x.clientHeight>=x.scrollHeight-2};
  up.addEventListener("click",()=>{x.scrollBy({top:-x.clientHeight*.75,behavior:settings.calm?"auto":"smooth"})});
  dn.addEventListener("click",()=>{x.scrollBy({top:x.clientHeight*.75,behavior:settings.calm?"auto":"smooth"})});
  x.addEventListener("scroll",upd,{passive:true});upd();w.appendChild(n)})}
let rsz;window.addEventListener("resize",()=>{clearTimeout(rsz);rsz=setTimeout(()=>{addScrollers();scanReset()},150)});

function renderHome(){

/* word problem steps */
function mini(k){
  if(MODELS[k].rows)return`<div class="mini rowsm">${MODELS[k].rows.map(r=>`<div class="mr">${r.map(([key,w,c])=>`<span class="${c<0?"md":"seg"+(c+1)}" style="flex:0 0 ${w*100}%"></span>`).join("")}</div>`).join("")}</div>`;
  if(k==="cmp")return`<div class="mini"><div class="cmpr"><div class="r" style="background:var(--seg1)"><span></span></div><div class="short"><div class="b"></div><div class="d"></div></div></div></div>`;
  const n=MODELS[k].parts.length;
  return`<div class="mini"><div class="r">${Array.from({length:n},(_,j)=>`<span class="seg${j+1}"></span>`).join("")}</div><div class="br"></div></div>`;
}
function stepModel(P,pi){const w=PW(P.id,pi);const pt=P.parts[pi];
  const fb=settings.checks&&pt.m&&w.model?(w.model===pt.m?`<p class="mark ok">This diagram fits the story.</p>`:`<p class="mark no">Look again. Does this diagram match the story?</p>`):"";
  return`<p class="ask">Which strip diagram fits this problem?</p>${fb}<div class="models">${modelChoices(P,pi).map(k=>`<button class="mcard ${w.model===k?"on":""}" data-act="model" data-m="${k}"><span class="mt">${MODELS[k].t}</span><span class="ms">${MODELS[k].s}</span>${mini(k)}</button>`).join("")}</div>`}
function slot(w,k,cls,live){
  const s=(w.slots[w.model]||{})[k]||{};const v=fmt(s.tokens);const tag=live?"button":"div";
  return`<${tag} class="slot ${cls}" ${live?`data-act="slot" data-k="${k}"`:""}><span class="nm">${esc(s.name||"")}</span><span class="val ${v?"":"empty"}">${v?esc(v):(live?"Tap to label":"")}</span></${tag}>`;
}
function diagram(w,live){
  if(!w.model)return"";
  const RM=MODELS[w.model].rows;
  if(RM)return`<div class="dg cmp"><div class="cmp-rows">${RM.map(r=>`<div class="crow">${r.map(([k,f,c],j)=>slot(w,k,(c<0?"diff":"seg seg"+(c+1))+(j?" joined":""),live).replace('class="slot','style="flex:0 0 '+(f*100)+'%" class="slot')).join("")}</div>`).join("")}</div><div class="vbrace"></div>${slot(w,"total","whole",live)}</div>`;
  if(w.model==="cmp")return`<div class="dg cmp"><div class="cmp-rows"><div class="crow">${slot(w,"a","seg seg1 full",live)}</div><div class="crow">${slot(w,"b","seg seg2 short",live)}${slot(w,"diff","diff",live)}</div></div><div class="vbrace"></div>${slot(w,"total","whole",live)}</div>`;
  return`<div class="dg"><div class="bar">${MODELS[w.model].parts.map((k,j)=>slot(w,k,"seg"+(j+1),live)).join("")}</div><div class="brace"></div><div class="whole-wrap">${slot(w,"whole","whole",live)}</div></div>`;
}
function stepLabel(P,pi){const w=PW(P.id,pi);
  if(!w.model&&modelChoices(P,pi).length===1){w.model=modelChoices(P,pi)[0];if(!w.slots[w.model])w.slots[w.model]={};save()}
  if(!w.model)return`<p class="ask">Pick a model first.</p><button class="btn primary add" data-act="prev">Pick a model</button>`;
  return`<p class="ask">Tap each part of the diagram to label it. Use <span class="num">?</span> for the amount you need to find.</p>${diagram(w,true)}${w.model==="cmp"?`<p class="hint">Dashed part: the difference between the bars. Right side: both bars together.</p>`:""}`}
function stepsHTML(P,pi){const w=PW(P.id,pi);
  const cell=(i,f)=>{const v=fmt(w.steps[i][f]);return`<button class="cell ${v?"":"empty"}" data-act="ed" data-k="step" data-i="${i}" data-f="${f}">${v?esc(v):"Tap"}</button>`};
  const rows=w.steps.map((r,i)=>{let mark="";
    if(settings.checks){const a=val(fmt(r.a)),b=val(fmt(r.b)),c=val(fmt(r.c));
      if(a!=null&&b!=null&&c!=null){const x={"+":a+b,"−":a-b,"×":a*b,"÷":b?a/b:NaN}[r.op];mark=Math.abs(x-c)<1e-6?`<span class="mark ok">Correct</span>`:`<span class="mark no">Check this step</span>`}}
    return`<div class="eq"><span class="lbl">Step ${i+1}</span>${cell(i,"a")}<button class="cell op" data-act="op" data-i="${i}" aria-label="Operation">${r.op}</button>${cell(i,"b")}<span class="eqsign">=</span>${cell(i,"c")}${mark}${w.steps.length>1?`<button class="cell rm" data-act="rmstep" data-i="${i}">Remove step</button>`:""}</div>`}).join("");
  return`<div class="eqs">${rows}</div><button class="btn add" data-act="addstep">Add a step</button>`;
}
function stepSolve(P,pi){return`<p class="ask">Show your work. Write one step on each line.</p>${stepsHTML(P,pi)}`}
function frameParts(pt){if(!settings.frames)return["Answer: ",""];return(pt.frame&&/_{3,}/.test(pt.frame)?pt.frame:"The answer is ___.").split(/_{3,}/)}
function stepAnswer(P,pi){const w=PW(P.id,pi),pt=P.parts[pi];const parts=frameParts(pt);let h="";
  parts.forEach((t,i)=>{h+=esc(t);if(i<parts.length-1){const v=fmt(w.blanks["f"+i]);h+=`<button class="cell ${v?"":"empty"}" data-act="ed" data-k="fb" data-key="f${i}">${v?esc(v):"Tap"}</button>`}});
  return`<p class="ask">Finish the answer sentence.</p><div class="frame">${h}</div>${settings.read?`<button class="btn add" data-act="readans" data-pi="${pi}">Read my answer</button>`:""}`}
function statementText(P,pi){const w=PW(P.id,pi);const parts=frameParts(P.parts[pi]);let s="";parts.forEach((t,i)=>{s+=t;if(i<parts.length-1)s+=(fmt(w.blanks["f"+i])||"___")});return s}

/* other part types */
function itemSegs(s){return s.split(/(\{[^}]*\})/).filter(x=>x!=="")}
function partFill(P,pi){const pt=P.parts[pi],w=PW(P.id,pi);
  const fk=P.id+"/"+pi;const foc=settings.focus&&pt.items.length>1;let fi=Math.min(S.fi[fk]||0,pt.items.length-1);
  const rows=pt.items.map((s,ii)=>{if(foc&&ii!==fi)return"";let b=0;return`<div class="item">${itemSegs(s).map(seg=>{
    if(seg[0]!=="{")return esc(seg);
    const key=ii+"-"+(b++);const v=fmt(w.blanks[key]);
    if(seg==="{}")return`<button class="cell ${v?"":"empty"}" data-act="ed" data-k="fill" data-key="${key}">${v?esc(v):"Tap"}</button>`;
    const ch=seg.slice(1,-1).split("|");
    return`<span class="choice">${ch.map(c=>`<button class="cell ${v===c?"on":""}" data-act="choose" data-key="${key}" data-v="${esc(c)}">${esc(c)}</button>`).join("")}</span>`;
  }).join("")}${pt.nl?`<div class="nlrow"><span class="hint">Number line:</span>${["top","halfway","bottom"].map((lab,k)=>{const key=ii+"-nl"+k;const v=fmt(w.blanks[key]);return`<span class="nlc"><span class="nll">${lab}</span><button class="cell ${v?"":"empty"}" data-act="ed" data-k="fill" data-key="${key}">${v?esc(v):"Tap"}</button></span>`}).join("")}</div>`:""}</div>`}).join("");
  const fnav=foc?`<div class="focusnav"><button class="btn" data-act="fprev" data-k="${esc(fk)}" ${fi>0?"":"disabled"}>Previous item</button><span class="fcount">Item ${fi+1} of ${pt.items.length}</span><button class="btn primary" data-act="fnext" data-k="${esc(fk)}" data-n="${pt.items.length}" ${fi<pt.items.length-1?"":"disabled"}>Next item</button></div>`:"";
  return`<p class="ask">Tap each blank to fill it in.</p><div class="items ${foc?"one":""}">${rows}</div>${fnav}${pt.work&&settings.showWork?`<div class="worksec"><p class="ask">Show your work (optional).</p>${stepsHTML(P,pi)}</div>`:""}`;
}
function partTable(P,pi){const pt=P.parts[pi],w=PW(P.id,pi);
  const body=pt.rows.map((r,ri)=>`<tr>${r.map((c,ci)=>{if(c!=="")return`<td class="given">${esc(c)}</td>`;const key=ri+"-"+ci;const v=fmt(w.cells[key]);
    return`<td><button class="cell ${v?"":"empty"}" data-act="ed" data-k="tc" data-key="${key}">${v?esc(v):"Tap"}</button></td>`}).join("")}</tr>`).join("");
  const rv=fmt(w.rule);
  return`<p class="ask">${pt.rule?"Complete the table and write the rule.":"Tap each empty box to fill it in."}</p>
  ${pt.caption?`<p class="hint">${esc(pt.caption)}</p>`:""}
  <div class="tablewrap"><table class="wt"><tr>${pt.cols.map((c,ci)=>{if(c!==""||!pt.heads)return`<th>${esc(c)}</th>`;const v=fmt(w.cells["h-"+ci]);return`<th><button class="cell ${v?"":"empty"}" data-act="ed" data-k="tc" data-key="h-${ci}">${v?esc(v):"Label"}</button></th>`}).join("")}</tr>${body}</table></div>
  ${pt.rule?`<div class="rule">Rule:<button class="cell ${rv?"":"empty"}" data-act="ed" data-k="rule">${rv?esc(rv):"Tap to write the rule"}</button></div>`:""}`;
}
function partExplain(P,pi){const w=PW(P.id,pi);const v=fmt(w.ans);
  return`<p class="ask">Answer the question.${settings.stt?" You can speak, type, or tap words.":""}</p><button class="cell ansbox ${v?"":"empty"}" data-act="ed" data-k="ans">${v?esc(v):"Tap to answer"}</button>`;
}
function partOrder(P,pi){const pt=P.parts[pi],w=PW(P.id,pi);
  const pool=pt.items.map((x,i)=>w.seq.includes(i)?"":`<button class="chip" data-act="pick" data-i="${i}">${esc(x)}</button>`).join("");
  const sym=pt.desc?">":"<";
  const seq=w.seq.map((i,k)=>(k?`<span class="lt">${sym}</span>`:"")+`<span class="s">${esc(pt.items[i])}</span>`).join("");
  return`<p class="ask">Tap them in order from ${pt.desc?"greatest to least":"least to greatest"}.</p>${pt.line?`<p class="hint">${esc(pt.line)}</p>`:""}
  <div class="order"><div class="pool">${pool||`<span class="hint">All placed.</span>`}</div><p class="lab">${pt.desc?"Greatest to least":"Least to greatest"}</p><div class="seq">${seq||`<span class="hint">Your order shows here.</span>`}</div>
  <div class="rowbtns"><button class="btn" data-act="unpick" ${w.seq.length?"":"disabled"}>Undo last</button><button class="btn" data-act="clearseq" ${w.seq.length?"":"disabled"}>Start order over</button></div></div>
  ${pt.work!==false&&settings.showWork?`<div class="worksec"><p class="ask">Show your work (optional). Convert each to the same unit.</p>${stepsHTML(P,pi)}</div>`:""}`;
}
function frameHTML(P,pi){const w=PW(P.id,pi),pt=P.parts[pi];const parts=frameParts(pt);let h="";
  parts.forEach((t,i)=>{h+=esc(t);if(i<parts.length-1){const v=fmt(w.blanks["f"+i]);h+=`<button class="cell ${v?"":"empty"}" data-act="ed" data-k="fb" data-key="f${i}">${v?esc(v):"Tap"}</button>`}});return`<div class="frame">${h}</div>`}
function partSolve(P,pi){const pt=P.parts[pi],w=PW(P.id,pi);const v=fmt(w.ans);
  return`${settings.showWork?`<p class="ask">Show your work. Write one step on each line.</p>${stepsHTML(P,pi)}`:""}
  <div class="${settings.showWork?"worksec":""}"><p class="ask">Answer</p>${frameHTML(P,pi)}${settings.read?`<button class="btn add" data-act="readans" data-pi="${pi}">Read my answer</button>`:""}</div>
  ${pt.explain?`<div class="worksec"><p class="ask">Explain how you know.</p><button class="cell ansbox ${v?"":"empty"}" data-act="ed" data-k="ans">${v?esc(v):"Tap to explain"}</button></div>`:""}`;
}
function parseAlgo(s){const m=s.match(/^([a-z0-9]+\.)\s*(.*)$/i);const lab=m?m[1]:"",ex=m?m[2]:s;
  const op=/[−–-]/.test(ex)?"−":"+";const nums=ex.split(/\s*[+−–-]\s*/).map(x=>x.replace(/[^\d]/g,"")).filter(Boolean);
  const cols=Math.max(...nums.map(n=>n.length))+1;return{lab,op,nums,cols,ex}}
function algoAns(it,st){let d="";for(let j=0;j<it.cols;j++){const v=st.a&&st.a[j];if(v)d+=v;else if(d)d+="?"}return d.includes("?")?d:group(d)}
function algoState(w,ii){if(!w.algo)w.algo={};if(!w.algo[ii])w.algo[ii]={c:{},a:{}};return w.algo[ii]}
function partAlgo(P,pi){const pt=P.parts[pi],w=PW(P.id,pi);
  const its=pt.items.map(parseAlgo);
  if(!S.al||S.al.pid!==P.id||S.al.pi!==pi)S.al={pid:P.id,pi,ii:0,row:"a",col:its[0].cols-1};
  const ii=Math.min(S.al.ii,its.length-1),it=its[ii],st=algoState(w,ii);
  const sel=(r,j)=>S.al.row===r&&S.al.col===j?"sel":"";
  const gap=j=>{const p=it.cols-1-j;return p>0&&p%3===0?"g3":""};
  const tabs=its.map((t,k)=>{const done=Object.keys(algoState(w,k).a).length;return`<button class="btn ${k===ii?"on":""}" data-act="altab" data-i="${k}">${esc(t.lab||String(k+1))}${done?" ✓":""}</button>`}).join("");
  const cells=(r,store)=>Array.from({length:it.cols},(_,j)=>`<td class="${gap(j)}"><button class="acell ${r} ${sel(r,j)}" data-act="alsel" data-row="${r}" data-col="${j}" aria-label="${r==="a"?"answer":"regroup"} box">${esc(store[j]||"")}</button></td>`).join("");
  const numRow=(n,k)=>`<tr><td class="aop">${k===it.nums.length-1?it.op:""}</td>${Array.from({length:it.cols},(_,j)=>{const off=it.cols-n.length;return`<td class="adig ${gap(j)}">${j>=off?n[j-off]:""}</td>`}).join("")}</tr>`;
  return`<p class="ask">Tap a box, then tap a digit. In the answer row, the box moves left after each digit.</p>
  <div class="pickgrid algtabs">${tabs}</div>
  <div class="algwrap"><div class="tablewrap"><table class="alg">
   <tr><td class="aop small">regroup</td>${cells("c",st.c)}</tr>
   ${it.nums.map(numRow).join("")}
   <tr class="aline"><td class="aop"></td>${cells("a",st.a)}</tr></table></div>
   <div class="apad">${["7","8","9","4","5","6","1","2","3"].map(d=>`<button class="key" data-act="aldig" data-v="${d}">${d}</button>`).join("")}<button class="key fn" data-act="alerase">Erase</button><button class="key" data-act="aldig" data-v="0">0</button><button class="key fn" data-act="alnext" ${ii<its.length-1?"":"disabled"}>Next one</button></div></div>`;
}

/* ---------- record text and picture ---------- */
function stepLines(w){return w.steps.filter(r=>r.a.length||r.b.length||r.c.length).map(r=>`${fmt(r.a)||"___"} ${r.op} ${fmt(r.b)||"___"} = ${fmt(r.c)||"___"}`)}
function fillLine(s,w,ii){let b=0;return itemSegs(s).map(seg=>seg[0]==="{"?(fmt(w.blanks[ii+"-"+(b++)])||"___"):seg).join("")}

function recordText(P){
  const L=[(P.lesson?P.title:P.title||"Problem")];
  P.parts.forEach((pt,pi)=>{const w=PW(P.id,pi);if(P.parts.length>1)L.push("","Part "+(pt.label||String.fromCharCode(97+pi))+":");
    if(pt.type==="word"){
      if(w.model&&MODELS[w.model].rows){L.push("Strip diagram ("+MODELS[w.model].t+"):");MODELS[w.model].rows.forEach(r=>L.push("  "+r.map(([k])=>"["+slotText(w,k)+"]").join("")));L.push("  Total: "+slotText(w,"total"))}
      else if(w.model==="cmp")L.push("Strip diagram:","  Bar 1 ["+slotText(w,"a")+"]","  Bar 2 ["+slotText(w,"b")+"] + difference ["+slotText(w,"diff")+"]","  Together: "+slotText(w,"total"));
      else if(w.model)L.push("Strip diagram:","  "+MODELS[w.model].parts.map(k=>"["+slotText(w,k)+"]").join(""),"  Total: "+slotText(w,"whole"));
      stepLines(w).forEach(s=>L.push(s));L.push(statementText(P,pi));
    }else if(pt.type==="fill"){pt.items.forEach((s,ii)=>{L.push(fillLine(s,w,ii));if(pt.nl)L.push("   Number line: "+[0,1,2].map(k=>fmt(w.blanks[ii+"-nl"+k])||"___").join(", "))});stepLines(w).forEach(s=>L.push("Work: "+s))}
    else if(pt.type==="solve"){stepLines(w).forEach(s=>L.push(s));L.push(statementText(P,pi));if(pt.explain)L.push("Explanation: "+(fmt(w.ans)||"___"))}
    else if(pt.type==="algo"){pt.items.map(parseAlgo).forEach((it,ii)=>L.push(`${it.lab} ${it.nums.map(group).join(" "+it.op+" ")} = ${algoAns(it,algoState(w,ii))||"___"}`))}
    else if(pt.type==="table"){L.push(pt.cols.map((c,ci)=>c||fmt(w.cells["h-"+ci])||"___").join(" | "));pt.rows.forEach((r,ri)=>L.push(r.map((c,ci)=>c!==""?c:(fmt(w.cells[ri+"-"+ci])||"___")).join(" | ")));if(pt.rule)L.push("Rule: "+(fmt(w.rule)||"___"))}
    else if(pt.type==="explain")L.push(fmt(w.ans)||"___");
    else if(pt.type==="order"){L.push((pt.desc?"Greatest to least: ":"Least to greatest: ")+(w.seq.map(i=>pt.items[i]).join(pt.desc?" > ":" < ")||"___"));stepLines(w).forEach(s=>L.push("Work: "+s))}
  });
  return L.join("\n");
}
const PIC={W:1000,ink:"#14202E",ans:"#1745B0",muted:"#4D5B6B",seg:["#CFE0FB","#FBE2B0","#CBEAD4","#F5CFD9"],font:'"Atkinson Hyperlegible Next","Atkinson Hyperlegible",Arial,sans-serif'};

  function slotDraw(w,k,bx,by,bw,bh){const s=(w.slots[w.model]||{})[k]||{};const v=fmt(s.tokens);
    if(s.name)fitText(s.name,bx+bw/2,by+22,bw-12,15,700,PIC.muted);
    if(v)fitText(v,bx+bw/2,by+(s.name?bh-16:bh/2+8),bw-12,22,700,PIC.ans)}
  x.font=F(18,800);x.fillStyle=PIC.ink;x.fillText(P.lesson?P.title:(P.title||"Problem"),X0,y);y+=34;

    if(pt.type==="word"){

        RM.forEach((r,ri)=>{let xx=X0;const yy=y+ri*(bh+gap);r.forEach(([k,f,c])=>{const sw=bw*f;box(xx,yy,sw,bh,c<0?"#fff":PIC.seg[c],c<0);slotDraw(w,k,xx,yy,sw,bh);xx+=sw})});

        box(X0,y+80,bw*.62,bh,PIC.seg[1]);slotDraw(w,"b",X0,y+80,bw*.62,bh);box(X0+bw*.62,y+80,bw*.38,bh,"#fff",true);slotDraw(w,"diff",X0+bw*.62,y+80,bw*.38,bh);

      }else if(w.model){const ks=MODELS[w.model].parts,bw=MW,sw=bw/ks.length,bh=70;
        ks.forEach((k,j)=>{box(X0+j*sw,y,sw,bh,PIC.seg[j]);slotDraw(w,k,X0+j*sw,y,sw,bh)});
        const by=y+bh+8;x.strokeStyle=PIC.ink;x.lineWidth=3;x.beginPath();x.moveTo(X0+2,by);x.lineTo(X0+2,by+14);x.lineTo(X0+bw-2,by+14);x.lineTo(X0+bw-2,by);x.moveTo(X0+bw/2,by+14);x.lineTo(X0+bw/2,by+26);x.stroke();
        const tw=300;box(X0+bw/2-tw/2,by+32,tw,62,"#fff");slotDraw(w,"whole",X0+bw/2-tw/2,by+32,tw,62);y=by+120;}
      stepLines(w).forEach(s=>{y=rich([{t:s,a:true}],y,20)});
      const fp=frameParts(pt);const segs=[];fp.forEach((t,i)=>{segs.push({t});if(i<fp.length-1)segs.push({t:fmt(w.blanks["f"+i])||"___",a:true})});y=rich(segs,y+6,21)+6;
    }else if(pt.type==="fill"){
      pt.items.forEach((s,ii)=>{let b=0;const segs=itemSegs(s).map(seg=>seg[0]==="{"?{t:fmt(w.blanks[ii+"-"+(b++)])||"___",a:true}:{t:seg});y=rich(segs,y,21);
        if(pt.nl)y=rich([{t:"     Number line: "},{t:[0,1,2].map(k=>fmt(w.blanks[ii+"-nl"+k])||"___").join(",  "),a:true}],y,17)});

      pt.rows.forEach((r,ri)=>{const ry=y+rh*(ri+1);r.forEach((cv,ci)=>{x.strokeRect(X0+ci*cw,ry,cw,rh);const a=cv==="";const t=a?fmt(w.cells[ri+"-"+ci]):cv;if(t)fitText(t,X0+ci*cw+cw/2,ry+27,cw-10,19,a?700:400,a?PIC.ans:PIC.ink)})});

      const fp=frameParts(pt);const segs=[];fp.forEach((t,i)=>{segs.push({t});if(i<fp.length-1)segs.push({t:fmt(w.blanks["f"+i])||"___",a:true})});y=rich(segs,y+6,21);
      if(pt.explain)y=rich([{t:"Explanation: "},{t:fmt(w.ans)||"___",a:true}],y+4,19);}
    else if(pt.type==="algo"){const its=pt.items.map(parseAlgo);const cw=24,bw=310;let bx=X0,rowH=0,y0=y;

        for(let j=0;j<it.cols;j++){if(st.c[j]){x.font=F(14,700);x.fillStyle=PIC.ans;x.textAlign="center";x.fillText(st.c[j],cx(j)+cw/2,y0+18);x.textAlign="left"}}

          if(k===it.nums.length-1)x.fillText(it.op,gx+6,yy);for(let j=off;j<it.cols;j++)x.fillText(n[j-off],cx(j)+cw/2,yy);x.textAlign="left"});
        const ly=y0+48+(it.nums.length-1)*30+10;x.fillStyle=PIC.ink;x.fillRect(gx,ly,20+it.cols*cw,2);
        x.font=F(22,700);x.fillStyle=PIC.ans;x.textAlign="center";for(let j=0;j<it.cols;j++){if(st.a[j])x.fillText(st.a[j],cx(j)+cw/2,ly+28)}x.textAlign="left";

function sheetCfg(t){
  const P=prob(S.pid),pt=P.parts[t.pi];
  const c0=sheetCfg0(t,pt);if(!settings.words){delete c0.names;delete c0.words}return c0;
}
function sheetCfg0(t,pt){
  if(t.k==="slot")return{title:"Label this part",names:pt.words&&pt.words.length?pt.words:DEFAULT_WORDS};
  if(t.k==="step")return{title:"Step "+(t.i+1)+": "+{a:"first number",b:"second number",c:"answer"}[t.f]};
  if(t.k==="fb")return{title:"Fill in the answer",words:pt.words};
  if(t.k==="fill")return{title:"Fill in the blank",words:pt.words,ops:pt.ops,raw:pt.raw&&!/nl/.test(t.key)};
  if(t.k==="tc")return{title:/^h-/.test(t.key)?"Label this column":"Fill in the table",words:pt.words,ops:pt.ops};
  if(t.k==="rule")return{title:"Write the rule",words:RULE_WORDS};
  if(t.k==="ans")return{title:"Your answer",words:[...new Set((pt.ruleWords?RULE_WORDS:[]).concat(pt.words||[],EXPLAIN_WORDS))],long:true};
  return{title:""};
}
function getVal(t){const w=PW(S.pid,t.pi);
  if(t.k==="slot")return((w.slots[w.model]||{})[t.key]||{});
  if(t.k==="step")return{tokens:w.steps[t.i][t.f]};
  if(t.k==="fb"||t.k==="fill")return{tokens:w.blanks[t.key]};
  if(t.k==="tc")return{tokens:w.cells[t.key]};
  if(t.k==="rule")return{tokens:w.rule};
  if(t.k==="ans")return{tokens:w.ans};
}
function setVal(t,tokens,name){const w=PW(S.pid,t.pi);
  if(t.k==="slot")(w.slots[w.model]=w.slots[w.model]||{})[t.key]={name,tokens};
  else if(t.k==="step")w.steps[t.i][t.f]=tokens;
  else if(t.k==="fb"||t.k==="fill")w.blanks[t.key]=tokens;
  else if(t.k==="tc")w.cells[t.key]=tokens;
  else if(t.k==="rule")w.rule=tokens;
  else if(t.k==="ans")w.ans=tokens;
  save();
}
function chipsFor(P,pi){

  const pt=P.parts[pi];let units=ex.units;if(!units.length&&pt.type==="word")units=["kg","g","km","m","cm","L","mL"];

}

function shortCode(){return assign.items.every(i=>i.ref)?"G4:"+assign.items.map(i=>i.ref).join(","):""}
function titleFor(ids){const byL={};ids.forEach(id=>{const P=LIBMAP[id];const k="M"+P.mod+" Lesson "+P.lesson+" "+P.sec;(byL[k]=byL[k]||[]).push(P.n)});return Object.keys(byL).map(k=>k+" "+byL[k].join(", ")).join(" · ")}
const curMod=()=>MODULES.find(m=>m.n===S.tMod)||MODULES[0];
function renderTeacher(){
  const M=curMod();const L=M.lessons.find(l=>l.n===S.tLesson)||M.lessons[0];
  const modBtns=MODULES.map(m=>`<button class="btn ${m.n===M.n?"on":""}" data-act="tmod" data-n="${m.n}">Module ${m.n}</button>`).join("");
  const lessonBtns=M.lessons.map(l=>`<button class="btn ${l.n===L.n?"on":""}" data-act="tlesson" data-n="${l.n}">Lesson ${l.n}</button>`).join("");
  const nSel=Object.keys(S.tSel).filter(k=>S.tSel[k]).length;
  const secs=L.sections.map(sc=>`<div class="sect"><div class="row"><h3 style="flex:1">${esc(sc.name)}</h3><button class="btn" data-act="tall" data-sec="${sc.key}">Select all</button><button class="btn" data-act="tnone" data-sec="${sc.key}">Clear</button></div>
    <div class="plist">${sc.problems.map(p=>{const id=pidOf(M.n,L.n,sc.key,p.n);const P=LIBMAP[id];const t=(P.text?P.text+" ":"")+(P.parts[0].q||"");
      const types=[...new Set(P.parts.map(x=>TYPE_NAME[x.type]))].join(", ");
      return`<label><input type="checkbox" class="tpick" data-id="${id}" ${S.tSel[id]?"checked":""}><span class="pn">${p.n}.</span><span>${esc(t.length>150?t.slice(0,147)+"…":t)} <span class="chip-tag">${esc(types)}</span></span></label>`}).join("")}</div></div>`).join("");
  const cur=items();
  const list=cur.length?`<ol class="tlist">${cur.map((p,i)=>`<li><span>${esc(p.lesson?p.title:(p.title||"Custom problem"))}</span><button class="btn" data-act="tremove" data-i="${i}">Remove</button></li>`).join("")}</ol>`:`<p>Nothing assigned.</p>`;
  const code=shortCode()||b64(JSON.stringify(assign));
  const pdf=S.pdf;let pdfH="";
  if(pdf&&pdf.status==="busy")pdfH=`<p>Reading ${esc(pdf.name)}…</p>`;
  else if(pdf&&pdf.status==="error")pdfH=`<p class="err">${esc(pdf.error)}</p>`;
  else if(pdf&&pdf.status==="ready")pdfH=`<p>Found ${pdf.sections.reduce((a,s)=>a+s.items.length,0)} numbered problems. They will be set up as strip diagram problems. Check the ones to add.</p>
    ${pdf.sections.map((s,si)=>`<div class="sect"><h3>${esc(s.title)} <span class="small">(page ${s.page})</span></h3><div class="plist">${s.items.map((it,ii)=>`<label><input type="checkbox" class="ppick" data-sec="${si}" data-it="${ii}" ${it.on?"checked":""}><span>${esc(it.text)}</span></label>`).join("")}</div></div>`).join("")}
    <div class="row"><button class="btn primary" data-act="padd">Add checked problems</button><button class="btn" data-act="pclear">Discard</button></div>`;
  return`<header class="top"><h1>Teacher setup</h1><button class="btn primary" data-act="home">Back to student view</button></header>
  <main class="teacher">
   ${S.msg?`<p class="okmsg">${esc(S.msg)}</p>`:""}${S.err?`<p class="err">${esc(S.err)}</p>`:""}
   <section class="tcard"><h2>Choose problems · Grade 4</h2>
    <p>Pick a module and lesson, check the problems he should do, then assign them. Checked problems stay checked when you switch lessons, so you can mix lessons in one assignment.</p>
    <div class="pickgrid">${modBtns}</div>
    <p class="small">Module ${M.n}: ${esc(M.title)}</p>
    <div class="pickgrid">${lessonBtns}</div>
    <p class="small">Lesson ${L.n}: ${esc(L.topic)}</p>
    ${secs}
    <div class="row"><button class="btn primary" data-act="tassign" data-mode="replace" ${nSel?"":"disabled"}>Assign ${nSel} problem${nSel===1?"":"s"} (replace current list)</button><button class="btn" data-act="tassign" data-mode="add" ${nSel?"":"disabled"}>Add to current list</button></div>
   </section>
   <section class="tcard"><h2>Assigned now</h2>
    <label>Title the student sees<input type="text" id="t-title" value="${esc(assign.title||"")}"></label><div class="row"><button class="btn" data-act="ttitle">Save title</button></div>
    ${list}</section>
   <section class="tcard"><h2>Student tools</h2><p>Students choose their own tools each time the app opens: bigger buttons and text, colors, read aloud, word buttons, calculator, switch scanning, and more. Nothing is saved, so the next time the app opens the tools start fresh. For a switch user, an adult turns on scanning from the Tools button at the start.</p></section>
   <section class="tcard"><h2>Send this assignment to another device</h2>
    <p>Assignments and student work are saved on the device where they were made. To assign from your computer, copy this code and paste it on the student’s device.</p>
    <textarea id="t-code" readonly>${esc(code)}</textarea>
    <div class="row"><button class="btn" data-act="tcopy">Copy code</button></div>
    <label>Paste a code<textarea id="t-import"></textarea></label>
    <div class="row"><button class="btn" data-act="timport">Load this code</button></div></section>
   <details class="tcard"><summary>Other modules: add problems from a PDF</summary>
    <p>For modules not built in yet. Word problems come through as strip diagram problems. Tables, number lines, and fill-in items do not convert well; ask to have a module built in.</p>
    <label>PDF file<input type="file" id="t-pdf" accept="application/pdf,.pdf"></label>${pdfH}
    <label>Or type a word problem<textarea id="t-text"></textarea></label>
    <label>Answer sentence (use ___ for the blank)<input type="text" id="t-frame"></label>
    <div class="row"><button class="btn" data-act="tcustom">Add this problem</button></div></details>
   <section class="tcard"><h2>Reset</h2><div class="row"><button class="btn" data-act="tclearwork">Clear all student work</button></div></section>
   <p class="attrib">Problems from Bluebonnet Learning K–5 Math, Grade 4, Texas Education Agency, based on Great Minds’ Eureka Math. Licensed CC BY-NC-SA 4.0. Adapted here for eye-gaze access.</p>
  </main>`;
}
function b64(s){try{return btoa(unescape(encodeURIComponent(s)))}catch(e){return""}}
function unb64(s){return decodeURIComponent(escape(atob(s.trim())))}
function bindTeacher(){
  document.querySelectorAll(".tpick").forEach(cb=>cb.addEventListener("change",()=>{S.tSel[cb.dataset.id]=cb.checked;S.msg=null;render()}));
  document.querySelectorAll(".ppick").forEach(cb=>cb.addEventListener("change",()=>{S.pdf.sections[+cb.dataset.sec].items[+cb.dataset.it].on=cb.checked}));
  const f=document.getElementById("t-pdf");if(f)f.addEventListener("change",()=>{if(f.files&&f.files[0])readPdf(f.files[0])});
  bindSettings();
}

/* ---------- PDF reading (other modules) ---------- */
const NOISE=[/bluebonnet learning/i,/^name\b.*date\b/i,/^name\s*$/i,/^date\s*$/i,/^\d{1,3}$/,/©|copyright|texas education agency/i,/^lesson\s+\d+\s*:/i,/^model each problem/i,/^use a strip diagram/i];
const SECTION=/(problem set|exit ticket|homework|sprint|application problem|template)/i;
async function pageLines(page){
  const tc=await page.getTextContent();const rows=[];
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<3.5);if(!r){r={y,items:[]};rows.push(r)}r.items.push({x,s:it.str})});
  rows.sort((a,b)=>b.y-a.y);
  return rows.map(r=>r.items.sort((a,b)=>a.x-b.x).map(i=>i.s).join(" ").replace(/\s+/g," ").trim()).filter(Boolean);
}
function guessFrame(text){
  const qs=text.match(/[^.?!]*\?/g);if(!qs)return"The answer is ___.";const q=qs[qs.length-1].trim();let m;
  if((m=q.match(/^What (was|is|were|are) (the .+)\?$/i))){const s=m[2];return s.charAt(0).toUpperCase()+s.slice(1)+" "+m[1].toLowerCase()+" ___."}
  return"The answer is ___.";
}
async function readPdf(file){
  S.pdf={status:"busy",name:file.name};render();
  try{
    if(!window.pdfjsLib)throw new Error("The PDF reader did not load. Check the internet connection and reload the page.");
    const doc=await pdfjsLib.getDocument({data:await file.arrayBuffer(),isEvalSupported:false}).promise;
    const sections=[];let cur=null,last=null,count=0;
    for(let pn=1;pn<=doc.numPages;pn++){
      const lines=await pageLines(await doc.getPage(pn));count+=lines.length;let header="";
      for(const line of lines){
        if(!header&&SECTION.test(line)&&line.length<120){const mm=line.match(/lesson\s+\d+\s+[a-z ]+?(?=\s+\d|$)/i);header=mm?mm[0].trim():line}
        if(NOISE.some(r=>r.test(line)))continue;
        const m=line.match(/^(\d{1,2})[.)]\s+(.+)/);const n=m?+m[1]:0;
        if(m&&(n===1||(cur&&n===cur.next))){if(n===1||!cur){cur={title:header||("Page "+pn),page:pn,items:[],next:1};sections.push(cur)}last={text:m[2],on:/problem set/i.test(header)};cur.items.push(last);cur.next=n+1;continue}
        if(last&&!SECTION.test(line))last.text+=" "+line;
      }
      last=null;
    }
    sections.forEach(s=>s.items.forEach(it=>it.text=it.text.replace(/\s+/g," ").trim()));
    const keep=sections.filter(s=>s.items.length);
    if(!count)throw new Error("This PDF has no selectable text. Type the problems in instead.");
    if(!keep.length)throw new Error("No numbered problems were found in this PDF.");
    S.pdf={status:"ready",name:file.name,sections:keep};
  }catch(e){S.pdf={status:"error",name:file.name,error:e.message||"The PDF could not be read."}}
  render();
}

/* ---------- actions ---------- */
function curSc(){const P=prob(S.pid);return screens(P)[S.scr]}
function openEd(target){const cur=getVal(target)||{};S.ed={mode:"value",target,tokens:JSON.parse(JSON.stringify(cur.tokens||[])),name:cur.name||""}}
function confirmBox(msg,yes,fn){S.ed={mode:"confirm",msg,yes,fn}}
function clearMsgs(){S.msg=null;S.err=null;S.copyText=null}
const A={
  open(d){S.pid=d.id;S.view="problem";clearMsgs();const w=work[d.id];S.scr=w&&w.done?screens(prob(d.id)).length-1:0;showPic()},
  home(){S.view="home";S.ed=null;clearMsgs()},
  teacher(){S.view="teacher";clearMsgs();S.tSel={};const f=assign.items.find(i=>i.ref&&LIBMAP[i.ref]);if(f){S.tMod=LIBMAP[f.ref].mod;S.tLesson=LIBMAP[f.ref].lesson}},
  tmod(d){S.tMod=+d.n;S.tLesson=1;clearMsgs()},
  read(){readProblem();return"skip"},
  readref(){const el=document.querySelector(".refbody");if(el)speak(el.innerText);return"skip"},
  opencalc(){S.calcOpen=!S.calcOpen},
  calcstep(){const L=S.calcLast;if(!L)return;const w=PW(S.pid,curSc().pi);const tk=n=>[{t:"c",v:calcShow(n)}];
    const last=w.steps[w.steps.length-1];
    if(last&&!last.a.length&&!last.b.length&&!last.c.length){last.a=tk(L.a);last.op=L.op;last.b=tk(L.b);last.c=tk(L.res)}
    else w.steps.push({a:tk(L.a),op:L.op,b:tk(L.b),c:tk(L.res)});
    S.calcLast=null;save();S.scrollSteps=true},
  opentools(){S.ed={mode:"tools"}},
  closetools(){S.ed=null},
  tgl(d){settings[d.k]=!settings[d.k]},
  setopt(d){settings[d.k]=/^(breakEvery|scanSpeed)$/.test(d.k)?+d.v:d.v},
  openref(){S.ed={mode:"ref"}},
  calc(d){calcPress(d.v)},
  fprev(d){S.fi[d.k]=Math.max(0,(S.fi[d.k]||0)-1)},
  fnext(d){S.fi[d.k]=Math.min(+d.n-1,(S.fi[d.k]||0)+1)},
  endbreak(){const id=S.pendingNext;S.pendingNext=null;if(id)A.open({id});else S.view="home"},
  tresetset(){confirmBox("Reset all settings to the defaults?","Yes, reset",()=>{settings=Object.assign({},DEFAULTS);save();clearMsgs();S.msg="Settings reset."})},
  readans(d){speak(statementText(prob(S.pid),+d.pi))},
  prev(){if(S.scr>0)S.scr--;clearMsgs()},
  next(){const P=prob(S.pid),scs=screens(P);clearMsgs();
    if(S.scr<scs.length-1){S.scr++;if(scs[S.scr].done){if(!work[P.id].done)S.doneCount++;work[P.id].done=true;save()}return}
    const ps=items(),i=ps.findIndex(p=>p.id===S.pid);const nxt=i<ps.length-1?ps[i+1].id:null;
    if(settings.breakEvery&&S.doneCount>0&&S.doneCount%settings.breakEvery===0&&S.breakAt!==S.doneCount){S.breakAt=S.doneCount;S.pendingNext=nxt;S.view="break";return}
    if(nxt)A.open({id:nxt});else S.view="home"},
  model(d){const w=PW(S.pid,curSc().pi);w.model=d.m;if(!w.slots[d.m])w.slots[d.m]={};save()},
  slot(d){openEd({k:"slot",key:d.k,pi:curSc().pi})},
  ed(d){const t={k:d.k,pi:curSc().pi};if(d.key)t.key=d.key;if(d.i!=null)t.i=+d.i;if(d.f)t.f=d.f;openEd(t)},
  choose(d){const w=PW(S.pid,curSc().pi);w.blanks[d.key]=fmt(w.blanks[d.key])===d.v?[]:[{t:"w",v:d.v}];save()},
  pick(d){const w=PW(S.pid,curSc().pi);if(!w.seq.includes(+d.i))w.seq.push(+d.i);save()},
  unpick(){PW(S.pid,curSc().pi).seq.pop();save()},
  clearseq(){PW(S.pid,curSc().pi).seq=[];save()},
  op(d){S.ed={mode:"op",i:+d.i,pi:curSc().pi}},
  setop(d){PW(S.pid,S.ed.pi).steps[S.ed.i].op=d.v;S.ed=null;save()},
  addstep(){PW(S.pid,curSc().pi).steps.push({a:[],op:"−",b:[],c:[]});save()},
  rmstep(d){const pi=curSc().pi;confirmBox("Remove step "+(+d.i+1)+"?","Yes, remove it",()=>{PW(S.pid,pi).steps.splice(+d.i,1);save()})},
  key(d){sttFlush();const t=S.ed.tokens;const l=t[t.length-1];if(l&&l.t==="q")t.pop();t.push({t:sheetCfg(S.ed.target).raw?"r":"d",v:d.v})},
  rawc(){S.ed.tokens.push({t:"r",v:","})},
  altab(d){S.al.ii=+d.i;const it=parseAlgo(prob(S.pid).parts[S.al.pi].items[S.al.ii]);S.al.row="a";S.al.col=it.cols-1},
  alnext(){A.altab({i:S.al.ii+1})},
  alsel(d){S.al.row=d.row;S.al.col=+d.col},
  aldig(d){const w=PW(S.pid,S.al.pi),st=algoState(w,S.al.ii);
    if(S.al.row==="a"){st.a[S.al.col]=d.v;if(S.al.col>0)S.al.col--}else{const cur=st.c[S.al.col]||"";st.c[S.al.col]=(cur.length>=2?"":cur)+d.v}save()},
  alerase(){const w=PW(S.pid,S.al.pi),st=algoState(w,S.al.ii);delete st[S.al.row][S.al.col];save()},
  unit(d){sttFlush();const t=S.ed.tokens;const l=t[t.length-1];if(l&&l.t==="u")t.pop();if(t.length)t.push({t:"u",v:d.v})},
  word(d){sttFlush();S.ed.tokens.push({t:"w",v:d.v})},
  chip(d){sttFlush();const t=S.ed.tokens;const cfg=sheetCfg(S.ed.target);if(cfg.long||cfg.ops)t.push({t:"c",v:d.v});else S.ed.tokens=[{t:"c",v:d.v}]},
  q(){S.ed.tokens=[{t:"q"}]},
  bksp(){sttFlush();S.ed.tokens.pop()},
  clr(){S.ed.tokens=[];const el=document.getElementById("stt");if(el)el.value=""},
  name(d){S.ed.name=S.ed.name===d.v?"":d.v},
  cancel(){S.ed=null},
  done(){sttFlush();const e=S.ed;setVal(e.target,e.tokens,e.name);S.ed=null},
  yes(){const f=S.ed.fn;S.ed=null;f&&f()},
  no(){S.ed=null},
  allwork(){S.view="all";S.ed=null;clearMsgs()},
  copytext(d){const txt=d&&d.scope==="all"?finished().map(recordText).join("\n\n----------\n\n"):recordText(prob(S.pid));
    const fb=()=>{clearMsgs();S.copyText=txt;S.err="Copying was blocked here. The text below is selected; use Copy from the menu.";render();showPic();const b=document.getElementById("copybox");if(b){b.focus();b.select()}};
    try{navigator.clipboard.writeText(txt).then(()=>{clearMsgs();S.msg="Text copied. Switch to OrbitNote and paste it.";render();showPic()},fb)}catch(e){fb()}return"skip"},
  copypic(d){const all=d&&d.scope==="all";
    const fail=()=>{clearMsgs();S.err="Copy picture is blocked on this device. Press and hold the picture and choose Copy, or use Copy as text.";render();showPic()};
    try{const cv=all?pictureAll():picture(prob(S.pid));
      const blob=new Promise(res=>cv.toBlob(res,"image/png"));
      if(!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write)throw 0;
      navigator.clipboard.write([new ClipboardItem({"image/png":blob})]).then(()=>{clearMsgs();S.msg="Picture copied. Switch to OrbitNote and paste it.";render();showPic()},fail);
    }catch(e){fail()}return"skip"},
  restart(){confirmBox("Start this problem over? Everything on this problem will be cleared.","Yes, start over",()=>{delete work[S.pid];save();S.scr=0})},
  /* teacher */
  tlesson(d){S.tLesson=+d.n;clearMsgs()},
  tall(d){const M=curMod(),L=M.lessons.find(l=>l.n===S.tLesson)||M.lessons[0];L.sections.find(s=>s.key===d.sec).problems.forEach(p=>S.tSel[pidOf(M.n,L.n,d.sec,p.n)]=true)},
  tnone(d){const M=curMod(),L=M.lessons.find(l=>l.n===S.tLesson)||M.lessons[0];L.sections.find(s=>s.key===d.sec).problems.forEach(p=>S.tSel[pidOf(M.n,L.n,d.sec,p.n)]=false)},
  tassign(d){const ids=Object.keys(LIBMAP).filter(k=>S.tSel[k]);if(!ids.length)return;
    const newItems=ids.map(ref=>({ref}));
    if(d.mode==="replace"){assign.items=newItems;
      assign.title=titleFor(ids);}
    else{const have=new Set(assign.items.map(i=>i.ref));assign.items=assign.items.concat(newItems.filter(i=>!have.has(i.ref)))}
    save();clearMsgs();S.msg=ids.length+" problems assigned. Tap Back to student view when ready."},
  tremove(d){assign.items.splice(+d.i,1);save()},
  ttitle(){assign.title=document.getElementById("t-title").value.trim();save();clearMsgs();S.msg="Title saved."},
  tcopy(){const t=document.getElementById("t-code");const sel=()=>{t.focus();t.select()};
    try{navigator.clipboard.writeText(t.value).then(()=>{clearMsgs();S.msg="Code copied.";render()},sel)}catch(e){sel()}return"skip"},
  timport(){const v=document.getElementById("t-import").value.trim();clearMsgs();
    try{
      if(/^(G4|M2):/i.test(v)){const old=/^M2:/i.test(v);const refs=v.slice(3).split(",").map(s=>s.trim()).map(r=>old?migrateId(r):r).filter(r=>LIBMAP[r]);if(!refs.length)throw 0;
        assign={title:titleFor(refs),items:refs.map(ref=>({ref}))}}
      else{const o=JSON.parse(unb64(v));if(!o||!Array.isArray(o.items))throw 0;assign=o}
      save();S.msg="Assignment loaded.";
    }catch(e){S.err="That code could not be read. Copy the whole code and try again."}},
  tcustom(){const text=document.getElementById("t-text").value.trim();if(!text)return;const fr=document.getElementById("t-frame").value.trim();
    assign.items.push({id:uid(),title:"Problem",parts:[{type:"word",q:text,frame:fr||guessFrame(text),words:[]}]});save();clearMsgs();S.msg="Problem added."},
  padd(){const add=[];S.pdf.sections.forEach(s=>s.items.forEach(it=>{if(it.on)add.push({id:uid(),title:s.title.replace(/^(.{0,60}).*/,"$1"),parts:[{type:"word",q:it.text,frame:guessFrame(it.text),words:[]}]})}));
    assign.items=assign.items.concat(add);S.pdf=null;save();clearMsgs();S.msg=add.length+" problems added."},
  pclear(){S.pdf=null},
  tclearwork(){confirmBox("Clear all student work on this device?","Yes, clear it",()=>{work={};save();clearMsgs();S.msg="Student work cleared."})}
};
function showPic(){}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const fn=A[b.dataset.act];if(!fn)return;
  if(settings.speakKeys&&S.view==="problem"&&b.matches(".key,.chip,.mcard,.choice .cell,[data-act=aldig]"))speak(b.dataset.act==="calc"&&b.dataset.v==="="?"equals":btnLabel(b));
  const r=fn(b.dataset,b);if(r!=="skip")render();
  if(["open","next","prev","home","teacher","allwork"].includes(b.dataset.act))window.scrollTo(0,0)});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(S.view==="problem")render()});
S.ed={mode:"tools",first:true};
render();
})();
